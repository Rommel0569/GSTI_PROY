services:
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run app/main_dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - api
    restart: unless-stopped

  scheduler:
    build: .
    command: python src/scheduler.py
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - api
    restart: unless-stopped
